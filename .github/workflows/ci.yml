name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --check
      - name: Lints
        run: cargo clippy --release --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --release --locked
      - name: Installer syntax
        run: sh -n install.sh
      - name: AppStream metadata
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq appstream
          appstreamcli validate --no-net packaging/*.metainfo.xml
